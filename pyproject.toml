[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "azure-mcp-demo"
version = "0.1.0"
description = "Secretless, governed MCP server exposing read-only Azure inventory (lab)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Runtime deps are managed via app/requirements.txt to keep Docker layer caching clean.
# Install for development: pip install -e . -r requirements-dev.txt
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff — formatter + linter (replaces black + flake8 + isort).
# CI enforces: ruff format --check && ruff check
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length — handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# '.' on the pythonpath so `from app.auth...` works without installation.
pythonpath = ["."]
