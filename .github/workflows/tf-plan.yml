name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"

permissions:
  contents: read
  pull-requests: write  # to post plan as a PR comment

jobs:
  plan:
    name: terraform plan
    runs-on: ubuntu-latest

    env:
      # Required GitHub Variables (set in repo Settings > Secrets and variables > Variables):
      # AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_CLIENT_ID
      # Required GitHub Secret:
      # HCP_TF_TOKEN — HCP Terraform API token (workspace: az-mcp-demo, org: gitIgorrz)
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54531c595c8e1b3c0ed0a7a1dad3b6bb94ec  # v3.1.2
        with:
          terraform_version: "1.9"
          cli_config_credentials_token: ${{ secrets.HCP_TF_TOKEN }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false
        working-directory: terraform/

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -no-color -input=false 2>&1 | tee /tmp/tf-plan.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        working-directory: terraform/
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const rawPlan = fs.readFileSync('/tmp/tf-plan.txt', 'utf8');
            const plan = rawPlan.length > 60000
              ? rawPlan.slice(0, 60000) + '\n\n... [truncated — see full output in Actions log]'
              : rawPlan;
            const exitCode = '${{ steps.plan.outputs.exit_code }}';
            const status = exitCode === '0' ? '✅ Plan succeeded' : '❌ Plan failed';

            const body = [
              `## Terraform Plan — ${status}`,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '',
              '</details>',
              '',
              `*Triggered by @${context.actor} — commit \`${context.sha.slice(0,7)}\`*`,
            ].join('\n');

            // Delete any previous plan comments from this workflow to avoid clutter.
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments.data) {
              if (c.user.login === 'github-actions[bot]' && c.body.startsWith('## Terraform Plan')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if plan failed
        if: steps.plan.outputs.exit_code != '0'
        run: exit 1
