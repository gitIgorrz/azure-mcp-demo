repos:
  # Secret scanning — blocks commit if credentials are detected.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Python formatting and linting.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.7
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  # Terraform formatting (fast local check, no auth needed).
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt

  # Terraform security scan.
  # Requires checkov installed: pip install checkov
  - repo: https://github.com/bridgecrewio/checkov
    rev: "3.2.250"
    hooks:
      - id: checkov
        files: \.tf$
        args:
          - --framework=terraform
          - --quiet
          - --compact
          - --soft-fail-on=CKV_AZURE_140
